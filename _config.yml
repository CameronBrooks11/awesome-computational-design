title: Awesome Computational Design
description: >-
  A curated list of awesome open-source tools for computational engineering,
  data-driven design, scriptable tools, cyber-physical design, and
  computational science.
url: https://cameronbrooks11.github.io
baseurl: /awesome-computational-design

# README.md has no front matter, so give it a layout here rather than
# adding YAML to a file GitHub also renders on the repository page.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Supplying a kramdown block replaces GitHub Pages' defaults wholesale, so
# these restate them. input: GFM is the important one — without it the stock
# kramdown parser neither honours GitHub's backslash escapes nor autolinks
# bare URLs, and the rendered page drifts from what github.com shows.
# hard_wrap stays false so single newlines do not become line breaks.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  auto_ids: true
